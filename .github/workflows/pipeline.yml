name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_floci/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pytest boto3 awscli

      - name: Correr tests
        run: |
          cd lambda_main
          pytest test_handler.py -v

      - name: Configurar AWS
        run: |
          aws configure set aws_access_key_id test
          aws configure set aws_secret_access_key test
          aws configure set default.region us-east-1

      - name: Crear infraestructura
        run: |
          aws --endpoint-url http://localhost:4566 dynamodb create-table \
            --table-name Tasks \
            --attribute-definitions \
              AttributeName=userId,AttributeType=S \
              AttributeName=taskId,AttributeType=S \
            --key-schema \
              AttributeName=userId,KeyType=HASH \
              AttributeName=taskId,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST || true

          aws --endpoint-url http://localhost:4566 sqs create-queue \
            --queue-name pipeline-events || true

          aws --endpoint-url http://localhost:4566 s3 mb s3://deploy-logs || true

          aws --endpoint-url http://localhost:4566 lambda create-function \
            --function-name pipeline-notifier \
            --runtime python3.11 \
            --role arn:aws:iam::000000000000:role/lambda-role \
            --handler handler.handler \
            --zip-file fileb://lambda_notifier.zip || true

      - name: Deploy Lambda
        run: |
          cd lambda_main
          zip -r ../lambda_main.zip handler.py
          aws --endpoint-url http://localhost:4566 lambda update-function-code \
            --function-name pipeline-notifier \
            --zip-file fileb://../lambda_main.zip

      - name: Notificar resultado
        run: |
          aws --endpoint-url http://localhost:4566 sqs send-message \
            --queue-url http://localhost:4566/000000000000/pipeline-events \
            --message-body '{"status": "success", "branch": "main", "commit": "${{ github.sha }}"}'